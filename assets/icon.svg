<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- EmailHandler app icon. macOS grid: 824 px squircle centered in 1024 with room for the shadow. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9466" />
      <stop offset="0.55" stop-color="#ff6a3d" />
      <stop offset="1" stop-color="#f2502a" />
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="1" stop-color="#fff3e4" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#5a1a06" flood-opacity="0.32" />
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#7a2408" flood-opacity="0.28" />
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- chunky 3D edge -->
    <rect x="100" y="120" width="824" height="804" rx="210" fill="#c8401a" />
    <rect x="100" y="100" width="824" height="800" rx="210" fill="url(#bg)" />
  </g>
  <!-- soft highlight -->
  <ellipse cx="420" cy="230" rx="300" ry="120" fill="#ffffff" opacity="0.14" />

  <!-- confetti -->
  <circle cx="232" cy="300" r="22" fill="#ffc23d" />
  <circle cx="802" cy="760" r="18" fill="#ffffff" opacity="0.7" />
  <rect x="190" y="700" width="40" height="40" rx="10" transform="rotate(20 210 720)" fill="#ff6fae" />

  <!-- happy envelope -->
  <g filter="url(#soft)">
    <rect x="248" y="340" width="528" height="388" rx="92" fill="url(#paper)" />
  </g>
  <path d="M310 428 512 566 714 428" fill="none" stroke="#1f1b2d" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="404" cy="634" r="26" fill="#ff6fae" opacity="0.85" />
  <circle cx="620" cy="634" r="26" fill="#ff6fae" opacity="0.85" />

  <!-- sparkle -->
  <path d="M760 168c13 52 34 73 86 86-52 13-73 34-86 86-13-52-34-73-86-86 52-13 73-34 86-86Z" fill="#ffc23d" stroke="#1f1b2d" stroke-width="22" stroke-linejoin="round" />
</svg>
